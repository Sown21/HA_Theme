S_theme:
  # ===== Palette =====
  theme-bg: "#0b1120"
  theme-card-top: "#18233a"
  theme-card-bottom: "#0f172a"
  theme-border: "rgba(255, 255, 255, 0.06)"

  theme-blue: "#3b82f6"
  theme-orange: "#f59e0b"
  theme-yellow: "#ffce00"
  theme-green: "#22c55e"
  theme-red: "#ef4444"
  theme-purple: "#8b5cf6"
  theme-white: "#e2e8f0"
  theme-cyan: "#22d3ee"

  # ===== Couleurs principales =====
  primary-color: "var(--theme-blue)"
  accent-color: "var(--theme-orange)"

  # ===== Mode sombre =====
  modes:
    dark:
      # Fonds
      primary-background-color: "var(--theme-bg)"
      secondary-background-color: "var(--theme-card-bottom)"
      card-background-color: "var(--theme-card-bottom)"

      # Textes
      primary-text-color: "#e6edf7"
      secondary-text-color: "#8b9bb4"

  # ===== Cards =====
  ha-card-background: "linear-gradient(145deg, var(--theme-card-top), var(--theme-card-bottom))"
  ha-card-border-radius: "16px"
  ha-card-border-width: "1px"
  ha-card-border-color: "var(--theme-border)"
  ha-card-box-shadow: "none"

  # ===== Couleurs d'état =====
  state-switch-active-color: "var(--theme-yellow)"

  # ===== card-mod =====
  card-mod-theme: S_theme

  card-mod-card: |
    {# État de l'entité de la card, lu une seule fois.
       Vide si la card n'a pas d'"entity" (bar-card, grid, entities…) :
       sans cette précaution, le template plante et AUCUN style n'est appliqué. #}
    {% set etat = states(config.entity) if config.entity is defined and config.entity else '' %}

    /* ===== Effet au toucher (cards tile et button) ===== */
    /* :host(hui-tile-card) cible le TYPE de card, sans classe à ajouter.
       On anime "scale" (et non "transform") pour ne pas entrer en conflit
       avec d'autres effets. Enfoncement rapide, relâchement plus doux. */
    :host(hui-tile-card) ha-card,
    :host(hui-button-card) ha-card {
      transition: scale 0.2s ease-out;
    }
    :host(hui-tile-card) ha-card:active,
    :host(hui-button-card) ha-card:active {
      scale: 0.96;
      transition-duration: 0.08s;
    }
    @media (prefers-reduced-motion: reduce) {
      :host(hui-tile-card) ha-card:active,
      :host(hui-button-card) ha-card:active {
        scale: 1;
      }
    }

    /* ===== Prise ===== */
    :host(.prise) ha-card {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      /* "scale" répété ici : sinon cette ligne remplacerait celle de l'effet au toucher */
      transition: border-color 0.6s ease, box-shadow 0.6s ease, scale 0.2s ease-out;
    }
    :host(.prise) ha-card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(145deg,
        color-mix(in srgb, var(--theme-yellow) 35%, transparent),
        transparent 70%);
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    {% if etat == 'on' %}
    :host(.prise) ha-card {
      border-color: color-mix(in srgb, var(--theme-yellow) 50%, transparent);
      box-shadow: 0 0 20px color-mix(in srgb, var(--theme-yellow) 25%, transparent);
    }
    :host(.prise) ha-card::before {
      opacity: 1;
    }
    {% endif %}

    /* ===== Tempo ===== */
    :host(.tempo) ha-card {
      {% if etat == 'Bleu' %}
        --tempo-color: var(--theme-blue);
      {% elif etat == 'Blanc' %}
        --tempo-color: var(--theme-white);
      {% elif etat == 'Rouge' %}
        --tempo-color: var(--theme-red);
      {% else %}
        --tempo-color: transparent;
      {% endif %}
      --tile-color: var(--tempo-color) !important;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border-color: color-mix(in srgb, var(--tempo-color) 50%, transparent);
      box-shadow: 0 0 20px color-mix(in srgb, var(--tempo-color) 25%, transparent);
    }
    :host(.tempo) ha-card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(145deg,
        color-mix(in srgb, var(--tempo-color) 35%, transparent),
        transparent 70%);
    }

    /* ===== Tempo : jours restants (bar-card) ===== */
    /* La card remplit sa case, et les barres se répartissent dans la hauteur
       disponible au lieu de garder leurs marges fixes (qui débordaient). */
    :host(.tempo-jours) {
      height: 100%;
    }
    :host(.tempo-jours) ha-card {
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    :host(.tempo-jours) #states {
      flex: 1 1 auto;
      min-height: 0;
      /* hauteur forcée : le flex seul ne l'étire pas (vérifié en console) */
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      padding: 8px 16px;
    }
    :host(.tempo-jours) #states > * {
      margin-top: 0;
      margin-bottom: 0;
    }
    /* Barre centrée verticalement sur le nom et la valeur.
       (align-items sur bar-card-card est sans effet : bar-card l'impose) */
    :host(.tempo-jours) bar-card-background {
      align-self: center;
    }
    /* Nom à largeur fixe : toutes les barres démarrent au même endroit */
    :host(.tempo-jours) bar-card-name {
      flex: 0 0 3.5em;
      width: 3.5em;
      color: var(--secondary-text-color);
    }
    /* Valeur à largeur fixe, alignée à droite : les barres finissent au même endroit */
    :host(.tempo-jours) bar-card-value {
      flex: 0 0 2.5em;
      width: 2.5em;
      text-align: right;
      font-weight: 600;
    }
    /* Piste de fond : neutre et discrète, comme les bordures du thème */
    :host(.tempo-jours) bar-card-backgroundbar {
      background: rgba(255, 255, 255, 0.06);
      opacity: 1;
      filter: none;
      border-radius: 999px;
    }
    /* Barre remplie : raccourcie (au lieu d'être coupée) pour avoir
       un bout arrondi et une lueur visible. --bar-color et --bar-percent
       sont fournis par bar-card pour chaque ligne. */
    @keyframes tempo-fill {
      from { width: 0; }
    }
    :host(.tempo-jours) bar-card-currentbar {
      width: var(--bar-percent);
      background: linear-gradient(90deg,
        color-mix(in srgb, var(--bar-color) 65%, transparent),
        var(--bar-color));
      border-radius: 999px;
      box-shadow: 0 0 5px color-mix(in srgb, var(--bar-color) 30%, transparent);
      animation: tempo-fill 1.2s ease-out;
    }
    @media (prefers-reduced-motion: reduce) {
      :host(.tempo-jours) bar-card-currentbar {
        animation: none;
      }
    }

    /* ===== Cards mini-graph-card : base commune (climat, solaire) ===== */
    {# mini-graph-card n'a pas d'"entity" mais une liste "entities" :
       on lit la 1re entité de la liste, qu'elle soit écrite
       en texte simple ou sous forme "- entity: ...". #}
    {% set ents = config.entities if config.entities is defined and config.entities else [] %}
    {% set ent1 = ents[0] if ents else '' %}
    {% set ent1 = ent1.entity if ent1 is mapping else ent1 %}
    {# Chaque classe définit plus bas :
         --mg-color     : la couleur d'accent de la card
         --mg-intensite : la force de la teinte de fond (30 % par défaut) #}
    :host(.climat) ha-card,
    :host(.solaire) ha-card {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border-color: color-mix(in srgb, var(--mg-color) 40%, transparent);
      background:
        linear-gradient(160deg,
          color-mix(in srgb, var(--mg-color) var(--mg-intensite, 30%), transparent),
          transparent 70%),
        var(--ha-card-background, var(--card-background-color));
      transition: border-color 1s ease;
    }
    /* Hauteur pilotée par grid_options → rows (vue Sections) :
       la card remplit sa case, l'en-tête garde sa taille,
       et la courbe s'étire ou se tasse pour occuper le reste. */
    :host(.climat),
    :host(.solaire) {
      height: 100%;
    }
    :host(.climat) ha-card,
    :host(.solaire) ha-card {
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    :host(.climat) .graph,
    :host(.solaire) .graph {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    :host(.climat) .graph__container,
    :host(.climat) .graph__container__svg,
    :host(.solaire) .graph__container,
    :host(.solaire) .graph__container__svg {
      flex: 1 1 auto;
      min-height: 0;
      height: 100%;
    }
    :host(.climat) .graph__container__svg svg,
    :host(.solaire) .graph__container__svg svg {
      height: 100%;
      width: 100%;
    }
    /* Icône assortie à l'accent
       (mini-graph-card l'affiche semi-transparente : on remet opacity à 1) */
    :host(.climat) .icon,
    :host(.climat) .icon ha-icon,
    :host(.solaire) .icon,
    :host(.solaire) .icon ha-icon {
      --paper-item-icon-color: var(--mg-color);
      --state-icon-color: var(--mg-color);
      color: var(--mg-color);
      opacity: 1;
    }
    /* Textes : même hiérarchie que les autres cards
       (nom et valeur en blanc, unité et valeur secondaire en gris) */
    :host(.climat) .name,
    :host(.climat) .name span,
    :host(.climat) .state__value,
    :host(.solaire) .name,
    :host(.solaire) .name span,
    :host(.solaire) .state__value {
      color: var(--primary-text-color);
      opacity: 1;
    }
    :host(.climat) .state__uom,
    :host(.climat) .states--secondary,
    :host(.solaire) .state__uom,
    :host(.solaire) .states--secondary {
      color: var(--secondary-text-color);
      opacity: 1;
    }

    /* ===== Climat : couleur selon la température ===== */
    {% set temp = states(ent1) | float(none) if ent1 else none %}
    :host(.climat) ha-card {
      {% if temp is none %}
        --mg-color: transparent;
      {% elif temp < 18 %}
        --mg-color: var(--theme-blue);
      {% elif temp < 20 %}
        --mg-color: var(--theme-cyan);
      {% elif temp < 24 %}
        --mg-color: var(--theme-green);
      {% elif temp < 27 %}
        --mg-color: var(--theme-orange);
      {% else %}
        --mg-color: var(--theme-red);
      {% endif %}
    }

    /* ===== Solaire : intensité continue selon la production ===== */
    {# Puissance crête de l'installation, en W (1,5 kWc) #}
    {% set solaire_max = 1500 %}
    {% set puissance = states(ent1) | float(0) if ent1 else 0 %}
    {% set ratio = [puissance / solaire_max, 1] | min if puissance > 0 else 0 %}
    :host(.solaire) ha-card {
      {% if puissance < 10 %}
        /* Nuit / pas de production : card neutre, icône grise */
        --mg-color: var(--secondary-text-color);
        --mg-intensite: 0%;
      {% else %}
        --mg-color: var(--theme-yellow);
        /* De 8 % (production faible) à 45 % (pleine puissance) */
        --mg-intensite: {{ (8 + ratio * 37) | round(0) | int }}%;
        --solaire-halo: {{ (0.25 + ratio * 0.75) | round(2) }};
      {% endif %}
    }
    {% if puissance >= 10 %}
    @keyframes solaire-halo {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.15); }
    }
    /* Halo de soleil derrière l'icône (coin haut-droit),
       d'autant plus lumineux que la production est forte */
    :host(.solaire) ha-card::after {
      content: "";
      position: absolute;
      z-index: -1;
      pointer-events: none;
      top: -50px;
      right: -50px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle,
        color-mix(in srgb, var(--theme-yellow) 55%, transparent),
        transparent 70%);
      opacity: var(--solaire-halo);
      animation: solaire-halo 6s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      :host(.solaire) ha-card::after {
        animation: none;
      }
    }
    {% endif %}

    /* ===== Météo ===== */
    {% set meteo = etat %}
    :host(.meteo) ha-card {
      {% if meteo == 'sunny' %}
        --meteo-color: var(--theme-yellow);
      {% elif meteo == 'clear-night' %}
        --meteo-color: var(--theme-purple);
      {% elif meteo == 'partlycloudy' %}
        --meteo-color: var(--theme-orange);
      {% elif meteo in ['cloudy', 'fog', 'windy', 'windy-variant'] %}
        --meteo-color: #64748b;
      {% elif meteo in ['rainy', 'pouring', 'hail'] %}
        --meteo-color: var(--theme-blue);
      {% elif meteo in ['lightning', 'lightning-rainy'] %}
        --meteo-color: var(--theme-purple);
      {% elif meteo in ['snowy', 'snowy-rainy'] %}
        --meteo-color: var(--theme-white);
      {% else %}
        --meteo-color: transparent;
      {% endif %}
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border-color: color-mix(in srgb, var(--meteo-color) 40%, transparent);
      /* Teinte météo posée par-dessus le dégradé de base de la card.
         (::before reste ainsi libre pour l'éclair) */
      background:
        linear-gradient(160deg,
          color-mix(in srgb, var(--meteo-color) 40%, transparent),
          transparent 75%),
        var(--ha-card-background, var(--card-background-color));
    }

    /* ===== Météo : animations ===== */
    @keyframes meteo-halo {
      0%, 100% { transform: scale(1);    opacity: 0.6; }
      50%      { transform: scale(1.15); opacity: 1; }
    }
    @keyframes meteo-drift {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    @keyframes meteo-wind {
      from { transform: translateX(-100%); }
      to   { transform: translateX(100%); }
    }
    @keyframes meteo-rain {
      from { background-position: 0 0, 18px 30px; }
      to   { background-position: 0 70px, 18px 120px; }
    }
    @keyframes meteo-snow {
      from { background-position: 0 0, 20px 15px; }
      to   { background-position: 0 40px, 20px 82px; }
    }
    @keyframes meteo-flash {
      0%, 88%, 91%, 94%, 100% { box-shadow: inset 0 0 0 999px rgba(255, 255, 255, 0); }
      89%                     { box-shadow: inset 0 0 0 999px rgba(255, 255, 255, 0.25); }
      92.5%                   { box-shadow: inset 0 0 0 999px rgba(255, 255, 255, 0.15); }
    }
    /* Éclair : se dessine de haut en bas pendant le 1er flash (88-89 %),
       scintille avec le 2e flash (92.5 %), puis disparaît. */
    @keyframes meteo-bolt {
      0%, 87.9% { opacity: 0; clip-path: inset(0 0 100% 0); }
      88%       { opacity: 1; clip-path: inset(0 0 100% 0); }
      89%       { opacity: 1; clip-path: inset(0 0 0 0); }
      91%       { opacity: 0.2; clip-path: inset(0 0 0 0); }
      92.5%     { opacity: 1; clip-path: inset(0 0 0 0); }
      94%, 100% { opacity: 0; clip-path: inset(0 0 0 0); }
    }

    {% if meteo in ['sunny', 'clear-night', 'partlycloudy'] %}
    /* Soleil / nuit claire / éclaircies : halo */
    :host(.meteo) ha-card::after {
      content: "";
      position: absolute;
      z-index: -1;
      pointer-events: none;
      top: -60px;
      right: -60px;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle,
        color-mix(in srgb, var(--meteo-color) 45%, transparent),
        transparent 70%);
      animation: meteo-halo 6s ease-in-out infinite;
    }
    {% elif meteo in ['cloudy', 'fog'] %}
    /* Couvert / brouillard : nuages qui défilent */
    :host(.meteo) ha-card::after {
      content: "";
      position: absolute;
      z-index: -1;
      pointer-events: none;
      top: 0;
      left: 0;
      width: 200%;
      height: 100%;
      background:
        radial-gradient(ellipse 30% 40% at 25% 30%, rgba(255, 255, 255, 0.18), transparent 70%),
        radial-gradient(ellipse 25% 35% at 75% 65%, rgba(255, 255, 255, 0.14), transparent 70%);
      background-size: 50% 100%;
      background-repeat: repeat-x;
      filter: blur(4px);
      animation: meteo-drift 20s linear infinite;
    }
    {% elif meteo in ['windy', 'windy-variant'] %}
    /* Vent : rafales */
    :host(.meteo) ha-card::after {
      content: "";
      position: absolute;
      z-index: -1;
      pointer-events: none;
      inset: 0;
      background:
        linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent) 10% 25% / 45% 2px no-repeat,
        linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent) 60% 50% / 35% 1px no-repeat,
        linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.30), transparent) 25% 75% / 40% 2px no-repeat;
      animation: meteo-wind 2.5s linear infinite;
    }
    {% endif %}

    {% if meteo in ['rainy', 'pouring', 'hail', 'lightning-rainy'] %}
    /* Pluie : gouttes qui tombent (2 couches pour la profondeur) */
    :host(.meteo) ha-card::after {
      content: "";
      position: absolute;
      z-index: -1;
      pointer-events: none;
      inset: -10%;
      transform: skewX(-12deg);
      background:
        radial-gradient(1px 8px at 50% 50%, rgba(255, 255, 255, 0.40), transparent),
        radial-gradient(1px 6px at 50% 50%, rgba(255, 255, 255, 0.25), transparent);
      background-size: 37px 70px, 53px 90px;
      background-position: 0 0, 18px 30px;
      animation: meteo-rain {{ '0.4s' if meteo == 'pouring' else '0.7s' }} linear infinite;
    }
    {% elif meteo in ['snowy', 'snowy-rainy'] %}
    /* Neige : flocons qui descendent lentement */
    :host(.meteo) ha-card::after {
      content: "";
      position: absolute;
      z-index: -1;
      pointer-events: none;
      inset: 0;
      background:
        radial-gradient(circle 2px at 50% 50%, rgba(255, 255, 255, 0.70), transparent),
        radial-gradient(circle 1.5px at 50% 50%, rgba(255, 255, 255, 0.45), transparent);
      background-size: 40px 40px, 67px 67px;
      background-position: 0 0, 20px 15px;
      animation: meteo-snow 6s linear infinite;
    }
    {% endif %}

    {% if meteo in ['lightning', 'lightning-rainy'] %}
    /* Orage : éclairs (flash sur toute la card) */
    :host(.meteo) ha-card {
      animation: meteo-flash 7s linear infinite;
    }
    /* L'éclair en zigzag, en diagonale du haut-droit vers le bas-gauche */
    :host(.meteo) ha-card::before {
      content: "";
      position: absolute;
      z-index: -1;
      pointer-events: none;
      top: 0;
      right: 12%;
      width: 30%;
      height: 100%;
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 100'><polyline points='52,0 38,28 47,31 26,60 36,63 8,100' fill='none' stroke='white' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/></svg>") center / contain no-repeat;
      filter: drop-shadow(0 0 4px white) drop-shadow(0 0 10px var(--theme-purple));
      opacity: 0;
      animation: meteo-bolt 7s linear infinite;
    }
    {% endif %}

    @media (prefers-reduced-motion: reduce) {
      :host(.meteo) ha-card,
      :host(.meteo) ha-card::before,
      :host(.meteo) ha-card::after {
        animation: none;
      }
    }
    /* ===== Aspirateur (card tile d'un vacuum) ===== */
    {# États standard d'un vacuum HA :
       cleaning, returning, docked, paused, idle, error #}
    :host(.aspirateur) ha-card {
      {% if etat == 'cleaning' %}
        --aspi-color: var(--theme-green);
      {% elif etat == 'returning' %}
        --aspi-color: var(--theme-cyan);
      {% elif etat == 'docked' %}
        --aspi-color: var(--theme-blue);
      {% elif etat == 'paused' %}
        --aspi-color: var(--theme-orange);
      {% elif etat == 'error' %}
        --aspi-color: var(--theme-red);
      {% else %}
        --aspi-color: var(--secondary-text-color);
      {% endif %}
      --tile-color: var(--aspi-color) !important;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border-color: color-mix(in srgb, var(--aspi-color) 45%, transparent);
      box-shadow: 0 0 20px color-mix(in srgb, var(--aspi-color) 20%, transparent);
    }
    :host(.aspirateur) ha-card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(145deg,
        color-mix(in srgb, var(--aspi-color) 30%, transparent),
        transparent 70%);
    }

    {% if etat == 'cleaning' %}
    /* En nettoyage : ondes "radar" qui partent de l'icône */
    @keyframes aspi-onde {
      from { transform: scale(1);   opacity: 0.7; }
      to   { transform: scale(4.5); opacity: 0; }
    }
    :host(.aspirateur) ha-card::after {
      content: "";
      position: absolute;
      top: 10px;
      left: 10px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--aspi-color);
      z-index: -1;
      pointer-events: none;
      animation: aspi-onde 2.2s ease-out infinite;
    }
    {% elif etat == 'returning' %}
    /* Retour à la base : la lueur respire */
    @keyframes aspi-retour {
      0%, 100% { box-shadow: 0 0 8px  color-mix(in srgb, var(--aspi-color) 15%, transparent); }
      50%      { box-shadow: 0 0 26px color-mix(in srgb, var(--aspi-color) 45%, transparent); }
    }
    :host(.aspirateur) ha-card {
      animation: aspi-retour 2s ease-in-out infinite;
    }
    {% elif etat == 'error' %}
    /* Erreur : la bordure clignote */
    @keyframes aspi-erreur {
      0%, 100% { border-color: color-mix(in srgb, var(--aspi-color) 30%, transparent); }
      50%      { border-color: var(--aspi-color); }
    }
    :host(.aspirateur) ha-card {
      animation: aspi-erreur 1s ease-in-out infinite;
    }
    {% endif %}

    @media (prefers-reduced-motion: reduce) {
      :host(.aspirateur) ha-card,
      :host(.aspirateur) ha-card::after {
        animation: none;
      }
    }

    /* ===== Aspirateur : carte de nettoyage (card picture-entity) ===== */
    :host(.aspirateur-carte) ha-card {
      overflow: hidden;
    }
    :host(.aspirateur-carte) hui-image {
      padding: 8px;
      box-sizing: border-box;
    }
    /* Bandeau du nom : fondu vers le fond du thème au lieu du gris opaque */
    :host(.aspirateur-carte) .footer {
      background: linear-gradient(to bottom,
        transparent,
        color-mix(in srgb, var(--theme-bg) 85%, transparent));
      color: var(--primary-text-color);
      font-weight: 500;
    }

    /* ===== Volet (card tile d'un cover) ===== */
    {# Position : 0 = fermé, 100 = ouvert.
       Volet sans position (simple montée/descente) : déduite de l'état. #}
    {% set vpos = state_attr(config.entity, 'current_position') if config.entity is defined and config.entity else none %}
    {% set vpos = vpos|int(0) if vpos is not none else (0 if etat == 'closed' else 100) %}
    :host(.volet) ha-card {
      {% if etat in ['opening', 'closing'] %}
        --volet-color: var(--theme-cyan);
      {% elif vpos > 0 %}
        --volet-color: var(--theme-blue);
      {% else %}
        --volet-color: var(--secondary-text-color);
      {% endif %}
      --tile-color: var(--volet-color) !important;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      /* Lumière du jour : plus le volet est ouvert, plus la card s'éclaire */
      background:
        linear-gradient(145deg,
          color-mix(in srgb, var(--volet-color) {{ (vpos * 0.3)|round(0)|int }}%, transparent),
          transparent 70%),
        var(--ha-card-background);
      border-color: color-mix(in srgb, var(--volet-color) 40%, transparent);
      transition: border-color 0.6s ease, box-shadow 0.6s ease, scale 0.2s ease-out;
    }
    /* Le tablier : des lames qui descendent du haut selon la fermeture */
    :host(.volet) ha-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: {{ 100 - vpos }}%;
      z-index: -1;
      /* Lame : reflet clair en haut -> plus sombre en bas, puis joint noir */
      background: repeating-linear-gradient(to bottom,
        rgba(255, 255, 255, 0.14) 0,
        rgba(255, 255, 255, 0.04) 7px,
        rgba(0, 0, 0, 0.55) 7px 9px);
      border-bottom: 2px solid rgba(255, 255, 255, 0.25);
      transition: height 1s linear;
    }
    {% if etat in ['opening', 'closing'] %}
    /* En mouvement : les lames défilent et la bordure s'allume */
    @keyframes volet-monte    { to { background-position: 0 -9px; } }
    @keyframes volet-descend  { to { background-position: 0 9px; } }
    :host(.volet) ha-card {
      box-shadow: 0 0 18px color-mix(in srgb, var(--volet-color) 30%, transparent);
    }
    :host(.volet) ha-card::before {
      animation: {{ 'volet-monte' if etat == 'opening' else 'volet-descend' }} 0.4s linear infinite;
    }
    {% endif %}
    @media (prefers-reduced-motion: reduce) {
      :host(.volet) ha-card::before {
        animation: none;
        transition: none;
      }
    }

    /* ===== Chauffage (card tile d'un climate) ===== */
    {# hvac_action dit ce que l'appareil fait VRAIMENT (heating, idle, cooling…).
       Si l'intégration ne le fournit pas : on compare température et consigne. #}
    {% set ch_ok = config.entity is defined and config.entity and config.entity.startswith('climate.') %}
    {% set ch_action = state_attr(config.entity, 'hvac_action') if ch_ok else none %}
    {% set ch_preset = (state_attr(config.entity, 'preset_mode') or '')|lower if ch_ok else '' %}
    {% if ch_ok and ch_action is none %}
      {% set ch_actuelle = state_attr(config.entity, 'current_temperature')|float(none) %}
      {% set ch_consigne = state_attr(config.entity, 'temperature')|float(none) %}
      {% if etat in ['heat', 'heat_cool', 'auto'] and ch_actuelle is not none and ch_consigne is not none and ch_actuelle < ch_consigne %}
        {% set ch_action = 'heating' %}
      {% endif %}
    {% endif %}
    {% if etat == 'off' %}                                       {% set ch_mode = 'off' %}
    {% elif ch_action == 'heating' %}                            {% set ch_mode = 'chauffe' %}
    {% elif ch_action == 'cooling' %}                            {% set ch_mode = 'froid' %}
    {% elif ch_preset in ['eco', 'away', 'absence', 'hors-gel', 'frost_protection'] %}
                                                                 {% set ch_mode = 'eco' %}
    {% elif etat in ['heat', 'heat_cool', 'auto'] %}             {% set ch_mode = 'veille' %}
    {% elif etat == 'cool' %}                                    {% set ch_mode = 'froid-veille' %}
    {% else %}                                                   {% set ch_mode = 'off' %}
    {% endif %}
    :host(.chauffage) ha-card {
      {% if ch_mode == 'chauffe' %}
        --chauffage-color: var(--theme-orange); --chauffage-intensite: 35%;
      {% elif ch_mode == 'veille' %}
        --chauffage-color: var(--theme-orange); --chauffage-intensite: 12%;
      {% elif ch_mode == 'eco' %}
        --chauffage-color: var(--theme-green);  --chauffage-intensite: 15%;
      {% elif ch_mode == 'froid' %}
        --chauffage-color: var(--theme-cyan);   --chauffage-intensite: 30%;
      {% elif ch_mode == 'froid-veille' %}
        --chauffage-color: var(--theme-cyan);   --chauffage-intensite: 12%;
      {% else %}
        --chauffage-color: var(--secondary-text-color); --chauffage-intensite: 0%;
      {% endif %}
      --tile-color: var(--chauffage-color) !important;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      background:
        linear-gradient(to top,
          color-mix(in srgb, var(--chauffage-color) var(--chauffage-intensite), transparent),
          transparent 75%),
        var(--ha-card-background);
      border-color: color-mix(in srgb, var(--chauffage-color) 40%, transparent);
    }
    {% if ch_mode == 'chauffe' %}
    /* Chauffe : nappe de chaleur qui respire depuis le bas
       + particules d'air chaud qui montent et s'évanouissent */
    @keyframes chauffage-souffle {
      0%, 100% { transform: scaleY(0.75); opacity: 0.6; }
      50%      { transform: scaleY(1);    opacity: 1; }
    }
    @keyframes chauffage-particules {
      to { background-position: 0 -40px, 11px -60px; }
    }
    :host(.chauffage) ha-card {
      box-shadow: 0 0 20px color-mix(in srgb, var(--chauffage-color) 25%, transparent);
    }
    :host(.chauffage) ha-card::before,
    :host(.chauffage) ha-card::after {
      content: "";
      position: absolute;
      z-index: -1;
      pointer-events: none;
    }
    :host(.chauffage) ha-card::before {
      left: 0;
      right: 0;
      bottom: 0;
      height: 70%;
      background: linear-gradient(to top,
        color-mix(in srgb, var(--chauffage-color) 40%, transparent),
        transparent);
      transform-origin: bottom;
      animation: chauffage-souffle 3s ease-in-out infinite;
    }
    :host(.chauffage) ha-card::after {
      inset: 0;
      background-image:
        radial-gradient(circle, color-mix(in srgb, var(--chauffage-color) 70%, transparent) 1.5px, transparent 2.5px),
        radial-gradient(circle, color-mix(in srgb, var(--chauffage-color) 50%, transparent) 1px, transparent 2px);
      background-size: 34px 40px, 22px 30px;
      background-position: 0 0, 11px 0;
      /* les particules disparaissent en montant */
      -webkit-mask-image: linear-gradient(to top, black 10%, transparent 80%);
      mask-image: linear-gradient(to top, black 10%, transparent 80%);
      animation: chauffage-particules 3s linear infinite;
    }
    {% elif ch_mode == 'froid' %}
    /* Climatisation : bord givré qui respire */
    @keyframes chauffage-givre {
      0%, 100% { box-shadow: inset 0 0 12px color-mix(in srgb, var(--chauffage-color) 20%, transparent); }
      50%      { box-shadow: inset 0 0 26px color-mix(in srgb, var(--chauffage-color) 45%, transparent); }
    }
    /* + nappe d'air froid qui descend du haut et cristaux qui tombent
       (le miroir de la chauffe) */
    @keyframes chauffage-froid-souffle {
      0%, 100% { transform: scaleY(0.75); opacity: 0.6; }
      50%      { transform: scaleY(1);    opacity: 1; }
    }
    @keyframes chauffage-cristaux {
      to { background-position: 0 40px, 11px 60px; }
    }
    :host(.chauffage) ha-card {
      animation: chauffage-givre 4s ease-in-out infinite;
    }
    :host(.chauffage) ha-card::before,
    :host(.chauffage) ha-card::after {
      content: "";
      position: absolute;
      z-index: -1;
      pointer-events: none;
    }
    :host(.chauffage) ha-card::before {
      left: 0;
      right: 0;
      top: 0;
      height: 70%;
      background: linear-gradient(to bottom,
        color-mix(in srgb, var(--chauffage-color) 35%, transparent),
        transparent);
      transform-origin: top;
      animation: chauffage-froid-souffle 4s ease-in-out infinite;
    }
    :host(.chauffage) ha-card::after {
      inset: 0;
      background-image:
        radial-gradient(circle, color-mix(in srgb, white 80%, transparent) 1.5px, transparent 2.5px),
        radial-gradient(circle, color-mix(in srgb, var(--chauffage-color) 70%, transparent) 1px, transparent 2px);
      background-size: 34px 40px, 22px 30px;
      background-position: 0 0, 11px 0;
      /* les cristaux fondent en descendant */
      -webkit-mask-image: linear-gradient(to bottom, black 10%, transparent 80%);
      mask-image: linear-gradient(to bottom, black 10%, transparent 80%);
      animation: chauffage-cristaux 4s linear infinite;
    }
    {% endif %}
    @media (prefers-reduced-motion: reduce) {
      :host(.chauffage) ha-card,
      :host(.chauffage) ha-card::before,
      :host(.chauffage) ha-card::after {
        animation: none;
      }
    }
